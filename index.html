<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bevattningslogg</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="btn-group">
      <button id="btn-reset">Återställ</button>
    </div>
    <div class="btn-group">
      <button id="btn-pan" class="active">Pan</button>
    </div>
    <div class="btn-group">
      <button id="btn-zoom">Zoom</button>
      <button id="btn-zoomout">−</button>
      <button id="btn-zoomin">+</button>
    </div>
    <div class="date-range">
      <span class="dr-label">Från datum</span>
      <div class="dr-group">
        <button class="dr-btn" id="btn-sd-dec">−</button>
        <input type="date" id="range-start-date">
        <button class="dr-btn" id="btn-sd-inc">+</button>
      </div>
      <span class="dr-label">klockan</span>
      <div class="dr-group">
        <button class="dr-btn" id="btn-st-dec">−</button>
        <div class="hour-picker"><input type="text" id="range-start-time" placeholder="00" autocomplete="off"><div class="hp-dropdown"></div></div>
        <button class="dr-btn" id="btn-st-inc">+</button>
      </div>
      <span class="dr-label">Till datum</span>
      <div class="dr-group">
        <button class="dr-btn" id="btn-ed-dec">−</button>
        <input type="date" id="range-end-date">
        <button class="dr-btn" id="btn-ed-inc">+</button>
      </div>
      <span class="dr-label">klockan</span>
      <div class="dr-group">
        <button class="dr-btn" id="btn-et-dec">−</button>
        <div class="hour-picker"><input type="text" id="range-end-time" placeholder="00" autocomplete="off"><div class="hp-dropdown"></div></div>
        <button class="dr-btn" id="btn-et-inc">+</button>
      </div>
    </div>
    <div class="btn-group">
      <button id="btn-shift-back">−</button>
      <button id="btn-shift-fwd">+</button>
      <button id="btn-auto" class="active">Auto</button>
    </div>
    <a href="/settings.html" style="margin-left:auto">Inställningar</a>
  </header>
  <div id="bands"></div>
  <div id="chart"></div>
  <div id="auto-countdown" class="auto-countdown hidden">
    <div class="auto-countdown-box">
      <div class="auto-countdown-title">Auto-läge aktiveras om <span id="auto-countdown-secs">10</span> sekunder</div>
      <div class="auto-countdown-hint">Rör musen eller tryck valfri tangent för att avbryta</div>
    </div>
  </div>
  <script src="vendor/plotly-3.4.0.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
